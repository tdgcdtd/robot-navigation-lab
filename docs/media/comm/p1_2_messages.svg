<svg xmlns="http://www.w3.org/2000/svg" width="680" height="492" viewBox="0 0 680 492" role="img"><title>P1 六种消息的内容</title><desc>各消息的字段、本项目中的取值和作用</desc><style>.k-t{font:400 14px 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif;fill:#2C2C2A}.k-ts{font:400 12px 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif;fill:#5F5E5A}.k-th{font:500 14px 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif;fill:#2C2C2A}.k-box{fill:#F1EFE8;stroke:#B4B2A9}.k-arr{fill:none;stroke:#888780;stroke-width:1.5}.k-badge{font:500 11px 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif;fill:#FFFFFF}.k-purple>rect,rect.k-purple{fill:#EEEDFE;stroke:#534AB7}.k-purple>.k-th{fill:#3C3489}.k-purple>.k-ts{fill:#534AB7}.k-teal>rect,rect.k-teal{fill:#E1F5EE;stroke:#0F6E56}.k-teal>.k-th{fill:#085041}.k-teal>.k-ts{fill:#0F6E56}.k-coral>rect,rect.k-coral{fill:#FAECE7;stroke:#993C1D}.k-coral>.k-th{fill:#712B13}.k-coral>.k-ts{fill:#993C1D}.k-gray>rect,rect.k-gray{fill:#F1EFE8;stroke:#5F5E5A}.k-gray>.k-th{fill:#444441}.k-gray>.k-ts{fill:#5F5E5A}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="aT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="aC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="492" rx="12" fill="#FFFFFF"/>

<g class="k-teal"><rect x="40" y="40" width="290" height="124" rx="8" stroke-width="0.5"/><text class="k-th" x="56" y="60" dominant-baseline="central">/goal_pose · PoseStamped</text><text class="k-ts" x="56" y="86" dominant-baseline="central">header.frame_id = "world"</text><text class="k-ts" x="56" y="106" dominant-baseline="central">pose.position = (4.0, 4.0, 0)</text><text class="k-ts" x="56" y="126" dominant-baseline="central">pose.orientation = 四元数（箭头朝向）</text><text class="k-ts" x="56" y="146" dominant-baseline="central">作用：告诉规划节点去哪、朝哪</text></g>
<g class="k-teal"><rect x="350" y="40" width="290" height="124" rx="8" stroke-width="0.5"/><text class="k-th" x="366" y="60" dominant-baseline="central">/map · OccupancyGrid</text><text class="k-ts" x="366" y="86" dominant-baseline="central">info：100 × 100 格，每格 0.1 m</text><text class="k-ts" x="366" y="106" dominant-baseline="central">info.origin = (−5, −5)</text><text class="k-ts" x="366" y="126" dominant-baseline="central">data[10000]：0 空闲 / 100 占据</text><text class="k-ts" x="366" y="146" dominant-baseline="central">QoS transient_local：只发一次</text></g>
<g class="k-teal"><rect x="40" y="184" width="290" height="124" rx="8" stroke-width="0.5"/><text class="k-th" x="56" y="204" dominant-baseline="central">/planned_path · Path</text><text class="k-ts" x="56" y="230" dominant-baseline="central">header.frame_id = "world"</text><text class="k-ts" x="56" y="250" dominant-baseline="central">poses[]：拉直后约 4 个路径点</text><text class="k-ts" x="56" y="270" dominant-baseline="central">最后一点 = 精确目标 + 朝向</text><text class="k-ts" x="56" y="290" dominant-baseline="central">poses 为空 = 取消任务、停车</text></g>
<g class="k-teal"><rect x="350" y="184" width="290" height="124" rx="8" stroke-width="0.5"/><text class="k-th" x="366" y="204" dominant-baseline="central">/model/my_robot/odometry</text><text class="k-ts" x="366" y="230" dominant-baseline="central">类型 Odometry；pose.position = (x, y)</text><text class="k-ts" x="366" y="250" dominant-baseline="central">pose.orientation → 换算成 yaw</text><text class="k-ts" x="366" y="270" dominant-baseline="central">twist = 当前速度</text><text class="k-ts" x="366" y="290" dominant-baseline="central">由 Gazebo 差速插件实时算出</text></g>
<g class="k-teal"><rect x="40" y="328" width="290" height="124" rx="8" stroke-width="0.5"/><text class="k-th" x="56" y="348" dominant-baseline="central">/cmd_vel · Twist</text><text class="k-ts" x="56" y="374" dominant-baseline="central">linear.x = 前进速度（≤ 0.3 m/s）</text><text class="k-ts" x="56" y="394" dominant-baseline="central">angular.z = 转向速度（≤ 1.0 rad/s）</text><text class="k-ts" x="56" y="414" dominant-baseline="central">其余 4 个分量恒为 0</text><text class="k-ts" x="56" y="434" dominant-baseline="central">跟踪节点每 0.1 s 发一次</text></g>
<g class="k-teal"><rect x="350" y="328" width="290" height="124" rx="8" stroke-width="0.5"/><text class="k-th" x="366" y="348" dominant-baseline="central">/tf · TFMessage</text><text class="k-ts" x="366" y="374" dominant-baseline="central">world → my_robot/odom：静态，全 0</text><text class="k-ts" x="366" y="394" dominant-baseline="central">odom → chassis：Gazebo 实时发布</text><text class="k-ts" x="366" y="414" dominant-baseline="central">每条 = 一个子坐标系相对父的位姿</text><text class="k-ts" x="366" y="434" dominant-baseline="central">作用：RViz 把车画在对的位置</text></g>
<circle cx="52" cy="40" r="9" fill="#444441"/><text class="k-badge" x="52" y="40" text-anchor="middle" dominant-baseline="central">1</text><circle cx="362" cy="40" r="9" fill="#444441"/><text class="k-badge" x="362" y="40" text-anchor="middle" dominant-baseline="central">2</text><circle cx="52" cy="184" r="9" fill="#444441"/><text class="k-badge" x="52" y="184" text-anchor="middle" dominant-baseline="central">3</text><circle cx="362" cy="184" r="9" fill="#444441"/><text class="k-badge" x="362" y="184" text-anchor="middle" dominant-baseline="central">4</text><circle cx="52" cy="328" r="9" fill="#444441"/><text class="k-badge" x="52" y="328" text-anchor="middle" dominant-baseline="central">5</text><circle cx="362" cy="328" r="9" fill="#444441"/><text class="k-badge" x="362" y="328" text-anchor="middle" dominant-baseline="central">6</text></svg>
