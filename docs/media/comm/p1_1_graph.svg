<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" role="img"><title>P1 小车导航的 ROS 2 节点与话题</title><desc>RViz、规划节点、跟踪节点、Gazebo 四方通过五个话题通信</desc><style>.k-t{font:400 14px 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif;fill:#2C2C2A}.k-ts{font:400 12px 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif;fill:#5F5E5A}.k-th{font:500 14px 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif;fill:#2C2C2A}.k-box{fill:#F1EFE8;stroke:#B4B2A9}.k-arr{fill:none;stroke:#888780;stroke-width:1.5}.k-badge{font:500 11px 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif;fill:#FFFFFF}.k-purple>rect,rect.k-purple{fill:#EEEDFE;stroke:#534AB7}.k-purple>.k-th{fill:#3C3489}.k-purple>.k-ts{fill:#534AB7}.k-teal>rect,rect.k-teal{fill:#E1F5EE;stroke:#0F6E56}.k-teal>.k-th{fill:#085041}.k-teal>.k-ts{fill:#0F6E56}.k-coral>rect,rect.k-coral{fill:#FAECE7;stroke:#993C1D}.k-coral>.k-th{fill:#712B13}.k-coral>.k-ts{fill:#993C1D}.k-gray>rect,rect.k-gray{fill:#F1EFE8;stroke:#5F5E5A}.k-gray>.k-th{fill:#444441}.k-gray>.k-ts{fill:#5F5E5A}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="aT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="aC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="600" rx="12" fill="#FFFFFF"/>

